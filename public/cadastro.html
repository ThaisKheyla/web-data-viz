<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaTech | Cadastro</title>
  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body onload="listar()">
  <div class="header">
    <div class="container">
      <h1 class="titulo">AquaTech</h1>
      <ul class="navbar">
        <li><a href="index.html">Inicial</a></li>
        <li><a href="simulador.html">Simulador</a></li>
        <li>|</li>
        <li><a href="login.html">Login</a></li>
        <li class="agora"><a href="#">Cadastro</a></li>
      </ul>
    </div>
  </div>

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <div class="campo"><span>Código de ativação:</span><input id="codigo_input" type="text" placeholder="Insira aqui seu código" /></div>
          <div class="campo"><span>Nome:</span><input id="nome_input" type="text" placeholder="Seu nome" /></div>
          <div class="campo"><span>E-mail:</span><input id="email_input" type="text" placeholder="meuemail@provedor.com" /></div>
          <div class="campo"><span>CPF:</span><input id="cpf_input" type="number" placeholder="123.456.789-10" /></div>
          <div class="campo"><span>Senha:</span><input id="senha_input" type="password" placeholder="******" /></div>
          <div class="campo"><span>Confirmação da Senha:</span><input id="confirmacao_senha_input" type="password" placeholder="******" /></div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>
        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      <h4>Feito com amor por aluno &hearts; SPTech &copy; 2023</h4>
      <span class="version">v1.0.0</span>
    </div>
  </div>

  <!-- ✅ SCRIPT AO FINAL -->
  <script>
    let listaEmpresasCadastradas = [];

    function listar() {
      fetch("/empresas/listar", {
        method: "GET",
      })
        .then(function (resposta) {
          resposta.json().then((empresas) => {
            empresas.forEach((empresa) => {
              listaEmpresasCadastradas.push(empresa);
              console.log("Código de ativação encontrado:", empresa.codigo_ativacao);
            });
          });
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
        });
    }

    function cadastrar() {
      var nomeVar = nome_input.value;
      var emailVar = email_input.value;
      var senhaVar = senha_input.value;
      var confirmacaoSenhaVar = confirmacao_senha_input.value;
      var codigoVar = codigo_input.value;
      var cpf = cpf_input.value;
      var idEmpresaVincular;
      console.log(nomeVar, emailVar, senhaVar, confirmacaoSenhaVar, cpf, codigoVar);

      if (
        nomeVar == "" ||
        emailVar == "" ||
        senhaVar == "" ||
        confirmacaoSenhaVar == "" ||
        cpf == "" ||
        codigoVar == ""
      ) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Preencha todos os campos antes de continuar.";
        return false;
      }

      if (nomeVar.length < 1) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Nome deve ter ao menos 1 caractere.";
        return false;
      } else if (!emailVar.includes("@") || !emailVar.includes(".")) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "E-mail inválido, insira o @.";
        return false;
      } else if (senhaVar.length < 6) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "A senha deve conter pelo menos 6 caracteres.";
        return false;
      } else if (senhaVar !== confirmacaoSenhaVar) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "A senha e a confirmação precisam ser iguais.";
        return false;
      } else if (cpf.length != 11) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "CPF deve conter exatamente 11 números.";
        return false;
      }


      let codigoValido = false;

      for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
        if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
          idEmpresaVincular = listaEmpresasCadastradas[i].id;
          codigoValido = true;
          break;
        }
      }

      if (!codigoValido) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Código de ativação inválido.";
        return false;
      }

      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
          cpfServer: cpf,
          idEmpresaVincularServer: idEmpresaVincular,
        }),
      })
        .then(function (resposta) {
          if (resposta.ok) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando...";
            setTimeout(() => {
              window.location = "login.html";
            }, 2000);
          } else {
            throw "Erro ao cadastrar.";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
        });

      return false;
    }

    function sumirMensagem() {
      cardErro.style.display = "none";
    }
  </script>
</body>
</html>
